<!doctype html> .
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Patchwork</title>
        <link rel="stylesheet" href="style3d.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Kranky&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Luxurious+Roman&display=swap"
            rel="stylesheet"
        />

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
                    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/",
                    "troika-three-text": "https://cdn.jsdelivr.net/npm/troika-three-text@0.49.1/+esm"
                }
            }
        </script>
        <link
            type="text/css"
            rel="stylesheet"
            href="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.css"
        />
    </head>
    <body>
        <div class="container ui-font">
            <canvas id="three-js-canvas"></canvas>
            <div id="back-arrow" class="back-arrow">
                <img src="img3d/back.svg" class="arrow" />
            </div>

            <div id="player-name-input" class="intro-scene ui-font">
                <div>Name:</div>
                <div>
                    <input
                        type="text"
                        id="player-name"
                        class="ui-font"
                        size="10"
                        maxlength="20"
                    />
                </div>
                <div>Match ID:</div>
                <div>
                    <input
                        type="text"
                        class="ui-font"
                        id="match-id"
                        size="10"
                        maxlength="20"
                    />
                </div>
                <div>
                    <button id="host-button" class="host-join-button ui-text">
                        Host
                    </button>
                </div>
                <div>
                    <button id="join-button" class="host-join-button ui-text">
                        Join
                    </button>
                </div>
            </div>
            <div id="player-box-1" class="player-box-1">
                <div id="p1-buttons" class="p1-buttons"></div>
            </div>
            <span id="player-box-2" class="player-box-2">
                <span id="p2-buttons" class="p2-buttons"></span>
            </span>
        </div>
        <div id="patchwork_game" class="bonsai">
            <div id="patch-cost"></div>
        </div>
        <div id="player-turn" class="player-turn"></div>
        <script type="module" src="multiplayer.js"></script>
        <script type="module" src="patchwork_three.js"></script>
        <script src="generated_js/component.bc.js"></script>
    </body>
</html>
